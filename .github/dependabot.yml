# Dependabot, kept to a few pull requests rather than a hundred.
#
# Without this file Dependabot opens **one pull request per vulnerable
# package**. Across this organisation's repositories that is around a hundred
# at once, which is a queue rather than progress — and is almost certainly why
# security updates were switched off here to begin with.
#
# `groups` is the control. One grouped pull request per ecosystem, so a
# security sweep arrives as something a person can read in a sitting.
# `open-pull-requests-limit` deliberately does **not** help: it applies to
# version updates only, and GitHub exempts security updates from it.
#
# `schedule.interval` is per **ecosystem**, not per group — there is no
# per-group schedule. A `routine` group described as monthly under
# `interval: weekly` is a comment disagreeing with the config, which is what
# the first version of this file did. Security updates are not governed by
# `schedule` at all: they are opened when an alert appears, so a monthly
# interval slows routine bumps and nothing else.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # Everything with a published fix, in one pull request. Most of these
      # are transitive build tooling that moves with a single lockfile update.
      security:
        applies-to: security-updates
        patterns:
          - '*'
      # Routine bumps, also together: nobody reads the fourth patch-bump
      # pull request of the week.
      routine:
        applies-to: version-updates
        patterns:
          - '*'
    open-pull-requests-limit: 1
    labels:
      - dependencies

  # The workflows pin action versions and nothing was watching them: this
  # repository's CI sat on actions that run under Node 16 for two years.
  #
  # Both kinds, because `applies-to` defaults to `version-updates` when it is
  # left off — so without the first group an advisory against two actions
  # opens two pull requests. One group cannot cover both: `applies-to` takes
  # a single value.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
      actions:
        applies-to: version-updates
        patterns:
          - '*'
    open-pull-requests-limit: 1
    labels:
      - dependencies
