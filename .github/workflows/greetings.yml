name: Greetings

on: [pull_request, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@main
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        issue_message: "Thank you **@${{ github.actor }}** for your issue! We are glad you contributed!"
        pr_message: "Thank you **@${{ github.actor }}** for your first pull Request!"
